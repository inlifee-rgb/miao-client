name: build-macos

# 手动触发，或推 v* 标签时自动打包
on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注（可选）'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-miao-${{ hashFiles('build-app/MIAO-mac.spec') }}
          restore-keys: |
            ${{ runner.os }}-pip-miao-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview qrcode pillow

      - name: 生成 .icns 图标
        run: python build-app/make_icns.py

      - name: 打包 .app
        run: pyinstaller build-app/MIAO-mac.spec --noconfirm --clean

      - name: 读取版本号
        id: ver
        run: |
          V=$(awk -F"'" '/^APP_VERSION/{print $2; exit}' app.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "打包版本: $V"

      - name: 压缩并生成校验值
        run: |
          cd dist
          NAME="MIAO-mac-${{ steps.ver.outputs.version }}.zip"
          # 把安装说明一起打进包：用户解压第一眼就能看到放行步骤
          rm -rf pkg && mkdir -p pkg
          cp -R MIAO.app pkg/
          cp ../安装说明-macOS.txt pkg/安装说明-必读.txt
          ditto -c -k pkg "$NAME"
          shasum -a 256 "$NAME" > sha256.txt
          ls -lh
          cat sha256.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MIAO-mac-${{ steps.ver.outputs.version }}
          path: |
            dist/MIAO-mac-*.zip
            dist/sha256.txt
          retention-days: 30
          if-no-files-found: error
